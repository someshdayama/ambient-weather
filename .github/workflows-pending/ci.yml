# PENDING: move to .github/workflows/ci.yml. The box gh token lacks the `workflow` scope,
# so GitHub refused this file under .github/workflows/. Activate with:
#   gh auth refresh -h github.com -s workflow && git mv .github/workflows-pending/ci.yml .github/workflows/ci.yml

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run size

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
